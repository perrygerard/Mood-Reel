  /* type */
  --display:"Instrument Serif",Georgia,"Times New Roman",serif;
  --ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Fragment Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --fs-label:.75rem; --fs-sm:.875rem; --fs-body:1rem; --fs-title:1.75rem;
  --fs-hero:clamp(4rem,17.2vw,5.2rem); --fs-rank:clamp(4rem,19vw,5.5rem);
  /* space — 4px base */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --r:2px;
  color-scheme:light;
}
html,body{background:var(--ink);color:var(--text)}
body{background-size:100px 100px;font-family:var(--ui);font-size:var(--fs-body);line-height:1.55;min-height:100%;
  background-image:var(--grain)}
.wrap{max-width:560px;margin:0 auto;padding-block:var(--s3) var(--s7);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;
  transition:background-color 150ms ease-out,border-color 150ms ease-out,color 150ms ease-out,transform 120ms ease-out}
button:active:not(:disabled){transform:translateY(1px)}
:focus-visible{outline:2px solid var(--safe-hi);outline-offset:3px;border-radius:var(--r)}
/* the ring is for keyboard travel only: hidden whenever the last input was a tap or click */
html[data-input="pointer"] :focus-visible{outline:none}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding-block:var(--s2)}
.brand{font-family:var(--display);font-style:italic;font-size:1.5rem;line-height:1;display:flex;align-items:center;gap:var(--s2);color:var(--text-hi)}
.brand i{width:8px;height:8px;border-radius:50%;background:var(--safe)}
.listbtn{font-family:var(--mono);font-size:var(--fs-label);letter-spacing:.06em;text-transform:uppercase;min-height:44px;
  padding:var(--s2) var(--s3);border:1px solid var(--ctl);border-radius:var(--r);color:var(--text)}
.listbtn:hover{border-color:var(--muted)}
.listbtn[aria-pressed="true"]{background:var(--safe);border-color:var(--safe);color:var(--on-safe)}
.listbtn b{font-weight:400;font-variant-numeric:tabular-nums}

/* the sentence */
.sentence{font-family:var(--display);font-style:italic;font-size:var(--fs-hero);line-height:1.4;color:var(--text-hi);
  margin:var(--s6) 0 var(--s6);text-wrap:pretty;max-width:22ch}
.tok{display:inline-block;font-family:var(--mono);font-style:normal;font-size:.42em;letter-spacing:.08em;text-transform:uppercase;
  line-height:1;vertical-align:.2em;padding:1em .85em;--hw:20px;--hh:14px;max-width:100%;box-sizing:border-box}
.sentence .tok{line-height:1.2;text-align:left;margin-block:4px}
.tok .x{margin-left:.6em;opacity:.7}
.phrase{font:inherit;color:inherit;padding:0;text-align:left;text-decoration:underline;text-decoration-color:var(--safe);
  text-decoration-thickness:2px;text-underline-offset:.16em}
.phrase:hover{text-decoration-color:var(--safe-hi)}

/* mood contact sheet */
.sheet{display:grid;gap:var(--s5)}
.row{display:grid;gap:var(--s2)}
.row h2{display:flex;justify-content:space-between;gap:var(--s3);margin:0;padding-bottom:var(--s2);border-bottom:1px solid var(--line-soft);
  font-family:var(--mono);font-weight:400;font-size:var(--fs-label);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.moods{display:flex;flex-wrap:wrap;gap:var(--s3)}
.ticket{position:relative;isolation:isolate;display:inline-flex;flex:1 1 auto;align-items:stretch;min-height:72px;padding:0 0 0 20px;color:var(--text-hi);
  font-family:var(--mono);font-size:1.125rem;letter-spacing:.05em;text-transform:uppercase;--notch:9px;
  transition:transform 150ms ease-out}
.ticket .lbl{flex:1;align-self:center;padding:var(--s4) 0;text-align:left}
/* the stub: perforated off the right end */
.ticket .stub{flex:none;width:46px} /* spacer for the stub; the perforation itself is drawn on the ticket layer */
/* two layers: a charcoal edge, then the ticket stock 1px inside it; both notched at the sides */
.ticket::before,.ticket::after{content:"";position:absolute;z-index:-1;border-radius:3px;
  -webkit-mask:radial-gradient(circle at 0 50%,transparent var(--notch),#000 calc(var(--notch) + .5px)) left/51% 100% no-repeat,
               radial-gradient(circle at 100% 50%,transparent var(--notch),#000 calc(var(--notch) + .5px)) right/51% 100% no-repeat;
          mask:radial-gradient(circle at 0 50%,transparent var(--notch),#000 calc(var(--notch) + .5px)) left/51% 100% no-repeat,
               radial-gradient(circle at 100% 50%,transparent var(--notch),#000 calc(var(--notch) + .5px)) right/51% 100% no-repeat}
.ticket::before{inset:0;background:var(--ctl)}
.ticket::before,.ticket::after{border-radius:5px}
.ticket::after{inset:1px;background-color:var(--stock);transition:background-color 150ms ease-out;
  background-image:repeating-linear-gradient(to bottom,var(--ctl) 0 5px,transparent 5px 10px);
  background-size:2px calc(100% - 12px);background-position:right 24px center;background-repeat:no-repeat}
.ticket:hover{transform:translateY(-2px)}
.ticket:hover::after{background-color:var(--stock-hover)}

/* film strip: the dark stock sits on a layer behind the label, so the focus ring is never clipped */
.film{position:relative;isolation:isolate;color:var(--on-film);background:none;border:0}
.film::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:3px;transition:background-color 150ms ease-out;
  background-color:var(--film);
  background-image:var(--sprocket),var(--sprocket);
  background-size:var(--hw) var(--hh);
  background-position:left top,left bottom;
  background-repeat:round no-repeat}
button.film:hover::before,button.film:active::before{background-color:var(--film-hover)}
.ticket:disabled{opacity:.35;cursor:default}

/* decks */
.deck{display:flex;gap:var(--s3);overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none;
  margin-inline:calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding:var(--s2) max(16px, env(safe-area-inset-right, 0px)) var(--s6) max(16px, env(safe-area-inset-left, 0px));
  scroll-padding-inline:max(16px, env(safe-area-inset-left, 0px))}
.deck::-webkit-scrollbar{display:none}
.deck>*{flex:0 0 86%;max-width:420px;scroll-snap-align:start;scroll-snap-stop:always;min-width:0}
.deck:focus-visible{outline-offset:-2px}
.picks>*{flex-basis:88%;max-width:440px}

/* developing: everything safelight-red until it lands in front of you */
.pick .art img{filter:var(--tint);transition:filter 1.2s ease-out .1s}
.pick.dev .art img{filter:none}

/* theme cards */
.theme{display:flex;flex-direction:column;align-items:stretch;text-align:left;padding:0;overflow:hidden;
  background:var(--card);border-radius:var(--card-r);box-shadow:var(--card-shadow);transition:transform 150ms ease-out,box-shadow 150ms ease-out}
.theme:hover{transform:translateY(-2px);box-shadow:var(--card-shadow-hi)}
.strip{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:repeat(6,1fr);gap:3px;background:var(--card);height:clamp(260px,46vh,420px)}
.strip img{display:block;width:100%;height:100%;object-fit:cover;background:var(--ink-3)}
.strip img{min-height:0}
.strip img:nth-child(1){grid-column:1;grid-row:1 / span 4}
.strip img:nth-child(2){grid-column:1;grid-row:5 / span 2}
.strip img:nth-child(3){grid-column:2;grid-row:1 / span 3}
.strip img:nth-child(4){grid-column:2;grid-row:4 / span 3}
/* fewer than four titles: let the frames share the space */
.strip img:only-child{grid-column:1 / span 2;grid-row:1 / span 6}
.strip img:nth-child(2):last-child{grid-column:2;grid-row:1 / span 6}
.strip img:nth-child(3):last-child{grid-row:1 / span 6}
.theme .p{font-family:var(--display);font-style:italic;font-size:clamp(2.1rem,9vw,2.6rem);line-height:1.02;color:var(--text-hi);padding:var(--s4) var(--s5) 0;text-wrap:balance}
.theme .s{font-family:var(--mono);font-size:var(--fs-label);letter-spacing:.04em;color:var(--muted);padding:var(--s2) var(--s5) var(--s5)}

/* deck controls */
.dots{display:flex;gap:0;margin:0 0 var(--s2) -7px}
.dots button{width:22px;height:22px;display:grid;place-items:center}
.dots button::after{content:"";width:12px;height:3px;background:var(--line);transition:background-color 200ms ease-out,width 200ms ease-out}
.dots button[aria-current="true"]::after{background:var(--safe-hi);width:18px}
.deckbar{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s2);font-family:var(--mono);font-size:var(--fs-label);color:var(--muted);font-variant-numeric:tabular-nums}
.deckbar button{width:44px;height:44px;border-radius:var(--r);border:1px solid var(--ctl);color:var(--text)}
.deckbar button:hover:not(:disabled){border-color:var(--muted)}
.deckbar button:disabled{opacity:.3;cursor:default}
.deckbar .pos{min-width:6.5em;text-align:center}

/* top-5 picks */
.pick{display:flex;flex-direction:column;gap:var(--s3);background:var(--ink-2);border:0;border-radius:14px;box-shadow:0 10px 34px rgba(10,12,13,.28);
  overflow:hidden;padding:0 var(--s4) var(--s4)}
.pick .wedge{margin-top:auto;padding-top:var(--s3);border-top:1px solid var(--line-soft)}
.pick .watchrow{padding-top:var(--s1)}
.pick .art{margin:0 calc(-1 * var(--s4));overflow:hidden;background:var(--ink-3);border-bottom:1px solid var(--line-soft)}
.pick .art img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover}
.ph{display:grid;grid-template-columns:auto 1fr auto;align-items:start;gap:var(--s3)}
.rank{font-family:var(--display);font-style:italic;font-size:var(--fs-rank);line-height:.78;color:var(--safe);margin-top:2px}
.pick h3{font-family:var(--display);font-weight:400;font-size:var(--fs-title);line-height:1.1;margin:0;color:var(--text-hi);text-wrap:balance}
.pick .meta{margin-top:var(--s1)}
.blurb{margin:0;max-width:65ch}
.wedge{display:grid;gap:var(--s2)}
.wedge .wl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:var(--fs-label);letter-spacing:.08em;text-transform:uppercase;color:var(--text)}
.wedge .wl b{font-weight:400;color:var(--safe-hi);font-variant-numeric:tabular-nums}
.cells{display:grid;grid-template-columns:repeat(10,1fr);gap:2px}
.cells i{height:10px;border:1px solid var(--line-soft)}
.cells i.on{border-color:transparent;background:color-mix(in srgb,var(--safe-hi) calc(var(--i) * 9% + 10%),var(--ink-3))}

<body>

<div class="wrap">
  <header class="top">
    <div class="brand"><i aria-hidden="true"></i>Mood Reel</div>
    <button class="listbtn" id="listbtn" data-act="list" aria-pressed="false">My list · <b id="listn">0</b></button>
  </header>
  <p class="sentence" id="sentence"></p>
  <div class="mini" id="mini" inert><p class="minis" id="minis"></p></div>
  <main id="stage" tabindex="-1"><p class="loading">Loading the catalog…</p></main>
  <dialog class="detail" id="detail" aria-label="Title details"></dialog>
  <dialog class="reel" id="reel" aria-labelledby="reel-title"></dialog>
  <p class="sr" id="status" role="status" aria-live="polite"></p>
  <p class="note">Data from TMDB and JustWatch. This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
</div>

<script>
// [title, year, m|s, runtime(min, movies only), one-liner]
let T={},G={};

// Netflix-style tags: "moods", "story types", setting
const MOODS=[["understated","🍂"],["emotional","💧"],["heartfelt","💛"],["feel-good","☀️"],["romantic","🌹"],["witty","💬"],
["goofy","🤪"],["quirky","🦩"],["offbeat","🎈"],["irreverent","😏"],["exciting","⚡"],["suspenseful","⏳"],["gritty","🧱"],
["dark","🌑"],["ominous","🌫️"],["scary","👻"],["mind-bending","🌀"],["cerebral","🧠"],["imaginative","✨"],["inspiring","🏔️"]];
const STORY={und:"underdog stories",per:"period pieces",real:"based on real life",who:"whodunits",heist:"heists and capers",
rev:"revenge stories",coa:"coming of age",surv:"survival stories",fam:"family dramas",rom:"love stories",work:"workplace stories",
fish:"fish out of water",super:"ghosts and the supernatural",dys:"dystopias and futures",quest:"quests and adventures",
con:"cons and grifts",crime:"crime and cartels",nature:"nature and science",food:"food and travel",sat:"satires",
loop:"time-bending stories",mon:"monsters and myths",war:"war stories",frnd:"friendships",sport:"sports and competition",
inv:"investigations",space:"space stories"};
const STORY_ONE={und:"an underdog story",per:"a period piece",real:"a true story",who:"a whodunit",heist:"a heist",
rev:"a revenge story",coa:"a coming-of-age story",surv:"a survival story",fam:"a family drama",rom:"a love story",work:"a workplace story",
fish:"a fish-out-of-water story",super:"a ghost story",dys:"a dystopia",quest:"an adventure",con:"a con",crime:"a crime saga",
nature:"a nature film",food:"a food and travel show",sat:"a satire",loop:"a time-bending story",mon:"a monster or myth",war:"a war story",
frnd:"a friendship story",sport:"a sports story",inv:"an investigation",space:"a space story"};
const EMOJI=Object.fromEntries(MOODS);
const moodsOf=id=>G[id][0].split(" ");
const storiesOf=id=>G[id][1]?G[id][1].split(" "):[];

const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

const LOOK="darkroom";
function setLook(l){document.documentElement.dataset.style=l}
document.documentElement.lang="en";
document.documentElement.dataset.input="pointer";
addEventListener("pointerdown",()=>{document.documentElement.dataset.input="pointer"},{capture:true,passive:true});
addEventListener("keydown",e=>{if(["Tab","ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(e.key))document.documentElement.dataset.input="keyboard"},{capture:true});
const S={pick:"fmt",shown:40,step:2,expanded:false,fmt:store.get("mr.fmt","any"),svc:store.get("mr.svc","any"),mood:null,theme:null,sort:"new",list:false,saved:new Set(store.get("mr.saved",[])),seen:new Set(store.get("mr.seen",[]))};
const FMT={any:"anything",m:"a movie",s:"a series"};
const NEXT={any:"m",m:"s",s:"any"};
const SVC={n:["Netflix",t=>`https://www.netflix.com/search?q=${encodeURIComponent(t)}`],
  p:["Prime Video",t=>`https://www.amazon.com/s?k=${encodeURIComponent(t)}&i=instant-video`],
  h:["Hulu",t=>`https://www.hulu.com/search?q=${encodeURIComponent(t)}`],
  b:["BritBox",t=>`https://www.amazon.com/s?k=${encodeURIComponent(t)}&i=instant-video`]};
// BritBox comes through Prime Video, so it counts as Prime
const onSvc=(id,c)=>T[id][10].includes(c)||(c==="p"&&T[id][10].includes("b"));
const svcsOf=id=>{const s=T[id][10];return [...s].filter(c=>!(c==="b"&&s.includes("p")))};
const SVC_LABEL={any:"any service",n:"Netflix",p:"Prime Video",h:"Hulu"};
const SVC_NEXT={any:"n",n:"p",p:"h",h:"any"};
const fitsBase=id=>T[id]&&(S.fmt==="any"||T[id][2]===S.fmt)&&(S.svc==="any"||onSvc(id,S.svc));
const fits=id=>fitsBase(id)&&!S.seen.has(id); // titles marked as seen never come up again
function watchLinks(id){const t=T[id][0];const svcs=svcsOf(id).sort((a,b)=>(b===S.svc||(S.svc==="p"&&b==="b"))-(a===S.svc||(S.svc==="p"&&a==="b")));
  return `<div class="watchrow">${svcs.map(c=>`<a class="watch" href="${SVC[c][1](t)}" target="_blank" rel="noopener">Find on ${SVC[c][0]} ↗</a>`).join("")}</div>`}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dur=m=>m>=60?`${Math.floor(m/60)}h ${m%60}m`:`${m}m`;
const inMood=w=>Object.keys(G).filter(id=>fits(id)&&moodsOf(id).includes(w));

// theme cards: group the mood's titles by story type; stragglers go in one last card
function themesFor(w){
  const ids=inMood(w),groups={};
  ids.forEach(id=>storiesOf(id).forEach(k=>(groups[k]=groups[k]||[]).push(id)));
  const cards=Object.entries(groups).filter(([,g])=>g.length>=2).sort((a,b)=>b[1].length-a[1].length)
    .map(([k,g])=>({key:k,label:STORY[k],ids:g}));
  const covered=new Set(cards.flatMap(c=>c.ids));
  const rest=ids.filter(id=>!covered.has(id));
  if(rest.length) cards.push({key:"_more",label:`a few more ${w} picks`,ids:rest});
  return cards;
}
const currentTheme=()=>S.mood&&S.theme?themesFor(S.mood).find(c=>c.key===S.theme):null;

function sentence(){
  // built one step at a time, like Libby: each choice is a tag first, then becomes a film pill in the sentence
  if(S.pick==="fmt"&&!S.list) return "Find me…";
  let h=`Find me <button class="tok film" data-act="fmt" aria-label="${FMT[S.fmt]}. Change format">${FMT[S.fmt]}</button>`;
  if(S.pick==="svc"&&!S.list) return h+" on…";
  h+=` on <button class="tok film" data-act="svc" aria-label="${SVC_LABEL[S.svc]}. Change streaming service">${SVC_LABEL[S.svc]}</button> `;

function lift(card){const r=card.getBoundingClientRect(),w=document.createElement("div"),c=card.cloneNode(true);
  // a plain rounded frame with its own background and a hard clip; the card's content sits inside it
  w.className="flywrap";Object.assign(w.style,{left:r.left+"px",top:r.top+"px",width:r.width+"px",height:r.height+"px"});
  c.classList.add("flyinner");c.removeAttribute("data-id");c.classList.remove("scrolls");
  Object.assign(c.style,{height:"auto",minHeight:r.height+"px",marginTop:-card.scrollTop+"px"});
  w.appendChild(c);document.getElementById("reel").appendChild(w);
  card.style.opacity="0";return {c:w,r}}
// the remaining cards slide over to close the gap
// the empty slot shrinks to nothing, so the neighbours glide in together; snapping waits until they land
function closeGap(card){const deck=card.parentElement;if(!deck||card.dataset.closing||!S.seen.has(card.dataset.id))return;card.dataset.closing=1;
  const idx=[...deck.children].indexOf(card),w=card.getBoundingClientRect().width,gap=parseFloat(getComputedStyle(deck).columnGap)||0;
  const finish=()=>{const keep=deck.scrollLeft;card.remove();
    ["visibility","opacity","flexBasis","marginRight","padding","boxShadow","maxWidth"].forEach(p=>card.style[p]="");delete card.dataset.closing;
    deck.scrollLeft=keep;deck.style.scrollSnapType="";deck.dispatchEvent(new Event("scroll"));
    if(!deck.children.length){document.getElementById("reel").close();return}
    const next=deck.children[Math.min(idx,deck.children.length-1)];(next.querySelector(".seenbtn")||deck).focus({preventScroll:true})};
  if(RM()){finish();return}
  deck.style.scrollSnapType="none";
  Object.assign(card.style,{visibility:"hidden",padding:"0",boxShadow:"none",maxWidth:"none",flexBasis:w+"px"});
  const a=card.animate([{flexBasis:w+"px",marginRight:"0px"},{flexBasis:"0px",marginRight:-gap+"px"}],
    {duration:420,easing:"cubic-bezier(.32,.72,0,1)",fill:"forwards"});
  a.onfinish=()=>{a.cancel();finish()};
}
// fling the lifted copy off the top of the screen, carrying the speed of the flick
function flyOut(card,lifted,dy=0,v=0){
  const {c,r}=lifted||lift(card),to=-(r.bottom+80);
  const speed=Math.max(Math.abs(v),1.4),dur=RM()?0:Math.min(380,Math.max(170,(dy-to)/speed));
  const a=c.animate([{transform:`translateY(${dy}px) scale(${scaleFor(dy)})`},{transform:`translateY(${to}px) scale(.9)`}],
    {duration:dur,easing:"cubic-bezier(.22,.75,.3,1)",fill:"forwards"});
  setTimeout(()=>closeGap(card),dur*.45); // neighbours start moving while the card is still leaving
  a.onfinish=()=>c.remove();
}
const scaleFor=dy=>1-Math.min(.08,Math.abs(Math.min(0,dy))/2600);
let lastSeen=null,toastT=0;
function markSeen(id,lifted,dy,v){
  S.seen.add(id);store.set("mr.seen",[...S.seen]);
  const card=document.querySelector(`#reel .pick[data-id="${id}"]`);
  if(card){const deck=card.parentElement;lastSeen={id,card,idx:[...deck.children].indexOf(card)};
    flyOut(card,lifted,dy||0,v||0);
    const t=document.querySelector("#reel .toast");
    t.innerHTML=`Marked as seen <button data-act="undoseen">Undo</button>`;t.hidden=false;
    clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},5000)}
  else {render();announce(`${T[id][0]} marked as seen`)}
}
function undoSeen(){if(!lastSeen)return;const {id,card,idx}=lastSeen;lastSeen=null;
  S.seen.delete(id);store.set("mr.seen",[...S.seen]);
  card.getAnimations().forEach(a=>a.cancel());delete card.dataset.closing;
  ["visibility","opacity","flexBasis","marginRight","padding","boxShadow","maxWidth"].forEach(p=>card.style[p]="");
  const deck=document.querySelector("#reel [data-deck]");if(deck)deck.style.scrollSnapType="";
  if(card.isConnected)card.remove();
  if(deck){deck.insertBefore(card,deck.children[idx]||null);deck.scrollTo({left:idx*step(deck)});deck.dispatchEvent(new Event("scroll"));
    if(!RM())card.animate([{transform:"translateY(-60px) scale(.94)",opacity:0},{transform:"none",opacity:1}],{duration:320,easing:"cubic-bezier(.2,.8,.2,1)"})}
  const t=document.querySelector("#reel .toast");if(t){t.textContent="Restored";clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},1500)}}
// swipe up on a card, like closing an app on iPhone
(function(){
  const reel=document.getElementById("reel");
  let card=null,lifted=null,x0=0,y0=0,dy=0,samples=[];
  // touch events (not pointer events) so the browser can't take the gesture away halfway through
  const start=(t,x,y,target)=>{const c=target.closest(".rbody .pick");
    if(!c||target.closest("button,a")||lifted)return;
    if(c.classList.contains("scrolls")&&c.scrollTop+c.clientHeight<c.scrollHeight-2)return; // let long cards scroll first
    card=c;x0=x;y0=y;dy=0;samples=[{t,y}]};
  const move=(t,x,y,e)=>{if(!card)return;
    const dx=x-x0,raw=y-y0;
    if(!lifted){
      if(raw<-6&&Math.abs(raw)>Math.abs(dx)*.8){lifted=lift(card)}
      else if(Math.abs(dx)>10||raw>10){card=null;return} else return}
    if(e.cancelable)e.preventDefault(); // once lifted, the card owns the finger: no sideways scroll, no cancel
    dy=raw<0?raw:raw*.25; // downward pulls meet resistance
    samples.push({t,y});while(samples.length>2&&t-samples[0].t>100)samples.shift();
    lifted.c.style.transform=`translateY(${dy}px) scale(${scaleFor(dy)})`};
  const end=()=>{if(!card)return;const c=card;card=null;if(!lifted)return;const L=lifted;lifted=null;
    reel.dataset.dragged="1";setTimeout(()=>{delete reel.dataset.dragged},350); // swallow the click that follows a drag
    const s0=samples[0],s1=samples[samples.length-1],v=(s1.y-s0.y)/Math.max(1,s1.t-s0.t); // px per ms, negative = upward
    // goes if it's a quarter of the way up and not being pulled back down, or flicked upward at any distance
    if((dy<-L.r.height*.22&&v<.15)||v<-.35||dy<-L.r.height*.5){markSeen(c.dataset.id,L,dy,Math.min(v,-.6))}
    else{const a=L.c.animate([{transform:`translateY(${dy}px) scale(${scaleFor(dy)})`},{transform:"none"}],
        {duration:RM()?0:420,easing:"cubic-bezier(.2,1.25,.35,1)",fill:"forwards"});
      a.onfinish=()=>{L.c.remove();c.style.opacity=""}}};
  const pt=e=>e.changedTouches[0];
  reel.addEventListener("touchstart",e=>{if(e.touches.length===1)start(e.timeStamp,pt(e).clientX,pt(e).clientY,e.target)},{passive:true});
  reel.addEventListener("touchmove",e=>move(e.timeStamp,pt(e).clientX,pt(e).clientY,e),{passive:false});
  reel.addEventListener("touchend",end);reel.addEventListener("touchcancel",end);
  // mouse / pen
  let pid=null;
  reel.addEventListener("pointerdown",e=>{if(e.pointerType==="touch")return;pid=e.pointerId;start(e.timeStamp,e.clientX,e.clientY,e.target)});
  reel.addEventListener("pointermove",e=>{if(e.pointerType==="touch"||e.pointerId!==pid)return;
    const was=!!lifted;move(e.timeStamp,e.clientX,e.clientY,e);if(!was&&lifted)try{reel.setPointerCapture(pid)}catch(_){}});
  const pend=e=>{if(e.pointerType!=="touch"&&e.pointerId===pid){pid=null;end()}};
  reel.addEventListener("pointerup",pend);reel.addEventListener("pointercancel",pend);
})();
// every card takes the tallest card's height (capped to the screen); match, links and "Seen it" sit at the bottom
function evenCards(){const deck=document.querySelector("#reel [data-deck]");if(!deck)return;
  const cards=[...deck.querySelectorAll(":scope>.pick")];cards.forEach(c=>{c.style.height="";c.classList.remove("scrolls")});
  const cs=getComputedStyle(deck),room=deck.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const h=Math.min(room,Math.max(0,...cards.map(c=>c.scrollHeight)));
  cards.forEach(c=>{c.style.height=h+"px";if(c.scrollHeight>c.clientHeight+2)c.classList.add("scrolls")});
  const dc=deck.querySelector(".dealcard");if(dc)dc.style.height=h+"px"}
addEventListener("resize",()=>{if(document.getElementById("reel").open)evenCards()});
// deal 5 from the pool: better matches turn up more often, and titles already dealt sit out until the pool runs dry
const HAND=5,dealt=store.get("mr.dealt",{});
function deal(key,ranked){if(ranked.length<=HAND)return ranked;
  const k=[S.mood,key,S.fmt,S.svc].join("|");let past=new Set(dealt[k]||[]);
  let pool=ranked.filter(([id])=>!past.has(id));
  if(pool.length<HAND){const last=new Set((dealt[k]||[]).slice(-HAND));past=new Set();pool=ranked.filter(([id])=>!last.has(id));if(pool.length<HAND)pool=ranked}
  const hand=[],w=pool.map(([,v])=>Math.exp((v-100)/8));
  while(hand.length<HAND&&pool.length){let x=Math.random()*w.reduce((a,b)=>a+b,0),i=0;while(i<w.length-1&&(x-=w[i])>0)i++;
    hand.push(pool[i]);pool.splice(i,1);w.splice(i,1)}
  dealt[k]=[...past,...hand.map(([id])=>id)];store.set("mr.dealt",dealt);
  return hand.sort((a,b)=>b[1]-a[1])}
function openReel(key,from,again){
  const dl=document.getElementById("reel");reelFrom=from;S.theme=key;
  const th=key==="_all"?null:currentTheme();
  const all=rankIds(key==="_all"?inMood(S.mood):th.ids),r=key==="_all"?all:deal(key,all);
  const more=r.length<all.length?`<div class="dealcard"><p>${all.length} titles fit this mood. Want a fresh hand?</p><button class="dealbtn" data-act="deal">Deal me ${HAND} more</button></div>`:"";
  const story=key==="_all"?"anything":key==="_more"?"something else":STORY_ONE[key]||th.label;
  const head=key==="_all"?`every ${S.mood} title`:key==="_more"?`more ${S.mood} picks`:th.label;
  dl.innerHTML=`<div class="rhead"><h2 class="eyebrow" id="reel-title">${esc(head[0].toUpperCase()+head.slice(1))}</h2>
      <p class="sr">${esc(S.mood)}, ${r.length} ${r.length===1?"title":"titles"}, best match first. Swipe or use the arrow keys.</p>
      <button class="rclose" data-act="closereel" aria-label="Close">✕</button></div>
    <div class="toast" role="status" hidden></div>
    <div class="rbody"><div class="deck picks" data-deck tabindex="0" aria-label="Titles, swipe or use arrow keys">${r.map(([id,v],i)=>pick(id,i+1,v)).join("")}${more}</div>${deckbar(r.length+(more?1:0))}</div>`;
  if(!dl.open)dl.showModal();wireDeck(dl.querySelector("[data-deck]"));
  evenCards();document.fonts.ready.then(evenCards);dl.querySelector("[data-deck]").focus({preventScroll:true});
  if(again&&!RM())dl.querySelectorAll(".rbody .pick").forEach((c,i)=>c.animate([{opacity:0,transform:"translateX(40px)"},{opacity:1,transform:"none"}],{duration:320,delay:i*40,easing:"cubic-bezier(.2,.8,.2,1)",fill:"backwards"}));
  announce(again?`${r.length} new ${STORY_ONE[key]||"titles"} picks`:`${S.mood}, ${story}: ${r.length} of ${all.length} titles`);
}
document.getElementById("reel").addEventListener("click",e=>{const r=document.getElementById("reel");
  if(r.dataset.dragged){delete r.dataset.dragged;return}
  if(!e.target.closest(".pick,.dealcard,button,a,.deckbar"))r.close()});
document.getElementById("reel").addEventListener("close",()=>{S.theme=null;document.getElementById("reel").innerHTML="";lastSeen=null;
  const key=reelFrom&&reelFrom.dataset.theme,deck=document.querySelector("#stage [data-deck]"),x=deck?deck.scrollLeft:0;
  render();const d2=document.querySelector("#stage [data-deck]");if(d2)d2.scrollLeft=x;
  const nb=key&&document.querySelector(`#stage [data-theme="${key}"]`);if(nb)nb.focus({preventScroll:true})});
function openDetail(id,from){const dl=document.getElementById("detail");opener=from;
  const r=S.list?[]:rankIds(resultsPool()),i=r.findIndex(x=>x[0]===id),v=i>=0?r[i][1]:score(id);
  dl.innerHTML=`<div class="dclose"><button data-act="close">Close</button></div>${pick(id,i+1,v)}`;
  dl.showModal();const img=dl.querySelector("img[data-art]");if(img)loadImg(img);dl.querySelector(".pick").classList.add("dev")}
document.getElementById("detail").addEventListener("close",()=>{const id=opener&&opener.dataset.open,y=window.scrollY;render();window.scrollTo(0,y);
  document.querySelectorAll(".grid img[src]").forEach(i=>{i.style.transitionDelay="0s";i.classList.add("dev-on")});
  const nb=id&&document.querySelector(`[data-open="${id}"]`);if(nb)nb.focus({preventScroll:true})});
const bundles={};
function bundle(b){return bundles[b]||(bundles[b]=fetch(`data/art${b}.json`).then(r=>r.json()).catch(()=>({})))}
const hiBundles={};
function hiBundle(b){return hiBundles[b]||(hiBundles[b]=fetch(`data/hi${b}.json`).then(r=>r.json()).catch(()=>({})))}
function loadImg(img){const hi=img.dataset.hi,id=hi||img.dataset.art;if(!T[id]||img.dataset.loading)return;img.dataset.loading=1;
  (hi?hiBundle(T[id][12]):bundle(T[id][9])).then(m=>{if(m[id])img.src=m[id]})}
function hydrate(){document.querySelectorAll("img[data-art]:not([src]),img[data-hi]:not([src])").forEach(img=>{if(!img.closest(".deck,.grid"))loadImg(img)})}
function hydrateNear(deck,i){[...deck.children].slice(Math.max(0,i-1),i+4).forEach(c=>c.querySelectorAll("img[data-art]:not([src]),img[data-hi]:not([src])").forEach(loadImg))}
fetch("data/titles.json").then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(d=>{
  for(const [k,v] of Object.entries(d)){T[k]=v;G[k]=[v[5],v[6],v[7]]}
  render();
}).catch(()=>{document.getElementById("stage").innerHTML=`<div class="empty"><strong>The catalog didn't load</strong>Check your connection, then reload the page.</div>`});
